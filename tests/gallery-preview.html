<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面色板 · ColorPick 拾色助手</title>
    <link rel="stylesheet" href="../color-gallery.css" />
  </head>
  <body>
    <!-- 顶部栏：品牌 + 来源页面信息 -->
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="8" height="8" rx="2.4" fill="currentColor" />
              <rect x="13" y="3" width="8" height="8" rx="2.4" fill="currentColor" opacity=".72" />
              <rect x="3" y="13" width="8" height="8" rx="2.4" fill="currentColor" opacity=".5" />
              <rect x="13" y="13" width="8" height="8" rx="2.4" fill="currentColor" opacity=".85" />
            </svg>
          </span>
          <span class="brand__text">ColorPick <b>拾色助手</b></span>
          <span class="brand__badge">色板</span>
        </div>

        <div class="source" id="sourceBox">
          <span class="source__label">来源页面</span>
          <a class="source__title" id="sourceTitle" href="#" target="_blank" rel="noreferrer noopener">—</a>
          <span class="source__time" id="sourceTime"></span>
        </div>
      </div>
    </header>

    <main class="page">
      <!-- 数据异常提示 -->
      <div class="banner" id="banner" hidden></div>

      <!-- 工具栏：统计 + 批量操作 + 导出 -->
      <section class="controls" id="controlsBar" aria-label="色板工具栏">
        <div class="controls__stats">
          <span class="stat"><b id="countTotal">0</b> 种颜色</span>
          <span class="stat__divider" aria-hidden="true"></span>
          <span class="stat">已选 <b id="countSelected">0</b></span>
        </div>

        <div class="controls__group" role="group" aria-label="选择操作">
          <button type="button" class="btn btn--ghost" id="selectAll">全选</button>
          <button type="button" class="btn btn--ghost" id="invert">反选</button>
          <button type="button" class="btn btn--ghost" id="clear">清空</button>
        </div>

        <div class="controls__group controls__group--end">
          <label class="field">
            <span class="field__label">排序</span>
            <select id="sortSelect" class="field__select">
              <option value="count">按出现频次</option>
              <option value="hue">按色相</option>
              <option value="hex">按色值</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">格式</span>
            <select id="formatSelect" class="field__select">
              <option value="css">CSS 变量</option>
              <option value="scss">SCSS 变量</option>
              <option value="json">JSON</option>
              <option value="txt">TXT 文本</option>
            </select>
          </label>

          <button type="button" class="btn btn--primary" id="downloadBtn">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 4v10m0 0l-3.6-3.6M12 14l3.6-3.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M5 17.5v1.2A1.3 1.3 0 0 0 6.3 20h11.4a1.3 1.3 0 0 0 1.3-1.3v-1.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            </svg>
            <span id="downloadLabel">下载选中</span>
          </button>
        </div>
      </section>

      <!-- 色板网格 -->
      <section class="grid" id="grid" aria-label="颜色列表"></section>

      <!-- 空状态 -->
      <section class="empty" id="empty" hidden>
        <div class="empty__art" aria-hidden="true">
          <svg viewBox="0 0 120 120" fill="none">
            <rect x="14" y="14" width="40" height="40" rx="12" fill="#7c5cff" opacity=".9" />
            <rect x="66" y="14" width="40" height="40" rx="12" fill="#ff6bcb" opacity=".9" />
            <rect x="14" y="66" width="40" height="40" rx="12" fill="#ffb86b" opacity=".9" />
            <rect x="66" y="66" width="40" height="40" rx="12" fill="#33d6a6" opacity=".9" />
            <circle cx="96" cy="24" r="14" fill="#fff" opacity=".55" />
          </svg>
        </div>
        <h2 class="empty__title">还没有颜色数据</h2>
        <p class="empty__desc">
          打开任意网页，点击右下角的「拾取颜色」按钮，插件会自动扫描这个页面的文字色、背景色和边框色，并把结果汇总到这里。
        </p>
        <ol class="empty__steps">
          <li><span class="empty__num">1</span>在目标网页点击右下角「拾取颜色」</li>
          <li><span class="empty__num">2</span>等待扫描完成，色板页会自动打开</li>
          <li><span class="empty__num">3</span>勾选需要的颜色，选择格式后下载</li>
        </ol>
      </section>
    </main>

    <!-- 底部：设置与说明 -->
    <footer class="footer">
      <div class="footer__inner">
        <label class="switch" for="fabToggle">
          <input type="checkbox" id="fabToggle" class="switch__input" />
          <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
          <span class="switch__text">在网页右下角显示悬浮按钮</span>
        </label>
        <p class="footer__note">
          色值数据仅保存在本机浏览器会话中 · ColorPick 拾色助手 v1.0.0
        </p>
      </div>
    </footer>

    <!-- 轻提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="mock.js"></script>
    <script src="../color-gallery.js"></script>
  </body>
</html>
